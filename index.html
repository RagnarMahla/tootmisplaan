<script>
    const CONFIG = { ins:{l:'Inseneeria',c:100,color:'#0097e6',order:0,p:'prog_ins',d:'done_ins',ws:2,prefix:'INS'}, trei:{l:'Treial',c:40,color:'#9b59b6',order:1,p:'prog_tr',d:'done_tr',ws:2,prefix:'TR'}, must_k:{l:'Must Keev',c:240,color:'#e67e22',order:2,p:'prog_mk',d:'done_mk',ws:6,prefix:'MK'}, rv_k:{l:'RV Keev',c:120,color:'#f39c12',order:2,p:'prog_rk',d:'done_rk',ws:3,prefix:'RK'}, must_l:{l:'Must Lukk',c:120,color:'#3498db',order:1,p:'prog_ml',d:'done_ml',ws:4,prefix:'ML'}, rv_l:{l:'RV Lukk',c:40,color:'#2980b9',order:1,p:'prog_rl',d:'done_rl',ws:2,prefix:'RL'}, kooste:{l:'Kooste',c:80,color:'#27ae60',order:3,p:'prog_ko',d:'done_ko',ws:4,prefix:'KO'} };
    window.isAdmin = false; const ADMIN_PIN = "1234"; window.saveTimeout = null; window.isSaving = false; window.hasPendingChanges = false; window.activeBrushIdx = null; window.currentEditIndex = -1; window.isNewOrder = false;
    const START_VIEW = new Date("2026-01-01"), TODAY = new Date();
    window.customCap = {}; window.orders = []; window.currentMainTabFilter = 'active'; window.tempAHTasks = { ah1: [], ah2: [] };
    const f = (v) => parseFloat(v) || 0;

    window.save = function(immediate) { window.saveData(immediate); };
    window.onbeforeunload = function(e) { if (window.isSaving || window.hasPendingChanges) { e.preventDefault(); e.returnValue = "Oota korraks!"; return "Oota korraks!"; } };

    function getValidDate(dStr) { let d = new Date(dStr); if (isNaN(d.getTime())) return new Date(); return d; }
    function safeISO(d) { const dt = new Date(d); let target = isNaN(dt.getTime()) ? new Date() : dt; let y = target.getFullYear(); let m = String(target.getMonth() + 1).padStart(2, '0'); let day = String(target.getDate()).padStart(2, '0'); return `${y}-${m}-${day}`; }
    function getUTCDate(d) { let dt = getValidDate(d); return Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
    function getDayIndexUTC(target, base) { const t = getUTCDate(target), b = getUTCDate(base); return Math.round((t - b) / 86400000); }
    function getWeek(d) { let d2 = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); d2.setUTCDate(d2.getUTCDate() + 4 - (d2.getUTCDay()||7)); return Math.ceil((((d2 - new Date(Date.UTC(d2.getUTCFullYear(),0,1))) / 86400000) + 1)/7); }
    window.onclick = function(event) { let alloc = document.getElementById('allocModal'); if (alloc && event.target == alloc) alloc.style.display = "none"; };
    function isHoliday(dateObj) { if (!window.customCap || !window.customCap.holidays || !Array.isArray(window.customCap.holidays)) return false; let dStr = safeISO(dateObj); let time = new Date(dStr).getTime(); for(let i=0; i<window.customCap.holidays.length; i++) { let h = window.customCap.holidays[i]; if (!h || !h.s) continue; let s = new Date(h.s).getTime(); let e = new Date(h.e || h.s).getTime(); if (time >= s && time <= e) return true; } return false; }
    function isWDay(dStr) { let d = getValidDate(dStr); let day = d.getDay(); return day !== 0 && day !== 6 && !isHoliday(d); }
    function addW(dStr, days) { let d = getValidDate(dStr); let added = 0; let safety = 0; while(added < days && safety < 1000) { d.setDate(d.getDate() + 1); if(isWDay(safeISO(d))) added++; safety++;} return safeISO(d); }
    function subW(dStr, days) { let d = getValidDate(dStr); let sub = 0; let safety = 0; while(sub < days && safety < 1000) { d.setDate(d.getDate() - 1); if(isWDay(safeISO(d))) sub++; safety++;} return safeISO(d); }
    function snapToW(dStr, dir="prev") { let d = getValidDate(dStr); let safety = 0; while(!isWDay(safeISO(d)) && safety < 30) { d.setDate(d.getDate() + (dir==="prev" ? -1 : 1)); safety++;} return safeISO(d); }
    function getWorkingDays(s, e) { let c = 0, cur = getValidDate(s); let endD = getValidDate(e); let safety = 0; while(cur <= endD && safety < 1000) { if(isWDay(safeISO(cur))) c++; cur.setDate(cur.getDate()+1); safety++; } return c || 1; }
    function updateSyncStatus(text, type) { const el = document.getElementById('syncStatus'); el.innerText = text; if(type === 'success') { el.style.background = "var(--success)"; el.style.color = "white"; } else if(type === 'danger') { el.style.background = "var(--danger)"; el.style.color = "white"; } else { el.style.background = "var(--warning)"; el.style.color = "black"; } }
    function calcOverallProgress(o) { let totalPlanned = f(o.ins) + f(o.trei) + f(o.must_k) + f(o.rv_k) + f(o.must_l) + f(o.rv_l) + f(o.kooste); if (totalPlanned === 0) return 0; let totalActual = f(o.prog_ins) + f(o.prog_tr) + f(o.prog_mk) + f(o.prog_rk) + f(o.prog_ml) + f(o.prog_rl) + f(o.prog_ko); return Math.round((totalActual / totalPlanned) * 100); }
    function getAllocated(o, dept) { let allocated = 0; if(o.allocs && o.allocs[dept]) Object.values(o.allocs[dept]).forEach(day => { Object.values(day).forEach(h => allocated += f(h)); }); return allocated; }

    window.smartExport = function() {
        try {
            const activeTab = document.querySelector('.content.active').id; const gV = document.getElementById('globalFilter').value.toLowerCase(); let filteredOrders = window.orders;
            if (activeTab === 'main_view') { const mV = document.getElementById('monthFilter').value; filteredOrders = filteredOrders.filter(o => { if (window.currentMainTabFilter === 'active' && o.status === 'Valmis') return false; if (window.currentMainTabFilter === 'archive' && o.status !== 'Valmis') return false; if (mV && !safeISO(o.end).includes(mV)) return false; return true; }); } else if (activeTab.startsWith('gantt_') || activeTab === 'dispatcher_view' || activeTab.includes('koormus')) { filteredOrders = filteredOrders.filter(o => o.status !== 'Valmis'); }
            if (gV) filteredOrders = filteredOrders.filter(o => (o.mt && String(o.mt).toLowerCase().includes(gV)) || (o.client && String(o.client).toLowerCase().includes(gV)) || (o.kirjeldus && String(o.kirjeldus).toLowerCase().includes(gV)));
            let csv = "\uFEFF"; const clean = str => `"${String(str || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`; const formatTasks = (tasks) => (tasks||[]).map(t => (t.done?'[x] ':'[ ] ')+t.name+(t.comment?' ('+t.comment+')':'')).join(', ');
            if (activeTab === 'main_view') {
                csv += "MT;Klient;Kirjeldus;Märkmed;Väline Link;Algus;Lõpp;AH1(p);AH1 Tegevused;AH2(p);AH2 Tegevused;INS Plaan;INS Tehtud;INS Valmis;TR Plaan;TR Tehtud;TR Valmis;MK Plaan;MK Tehtud;MK Valmis;RK Plaan;RK Tehtud;RK Valmis;ML Plaan;ML Tehtud;ML Valmis;RL Plaan;RL Tehtud;RL Valmis;KO Plaan;KO Tehtud;KO Valmis;Üld %;Staatus;Ost Valmis;AH1 Valmis;AH2 Valmis\n";
                const isD = (v) => String(v)==='true' ? 'JAH' : 'EI';
                filteredOrders.forEach(o => { let ah1T = o.allocs && o.allocs.ah_tasks ? o.allocs.ah_tasks.ah1 : []; let ah2T = o.allocs && o.allocs.ah_tasks ? o.allocs.ah_tasks.ah2 : []; csv += `${clean(o.mt)};${clean(o.client)};${clean(o.kirjeldus)};${clean(o.chk_notes)};${clean(o.link)};${safeISO(o.start)};${safeISO(o.end)};${o.sub1};${clean(formatTasks(ah1T))};${o.sub2};${clean(formatTasks(ah2T))};${o.ins};${o.prog_ins};${isD(o.done_ins)};${o.trei};${o.prog_tr};${isD(o.done_tr)};${o.must_k};${o.prog_mk};${isD(o.done_mk)};${o.rv_k};${o.prog_rk};${isD(o.done_rk)};${o.must_l};${o.prog_ml};${isD(o.done_ml)};${o.rv_l};${o.prog_rl};${isD(o.done_rl)};${o.kooste};${o.prog_ko};${isD(o.done_ko)};${o.progress}%;${o.status};${isD(o.chk_ost)};${isD(o.chk_ah1)};${isD(o.chk_ah2)}\n`; });
            } else if (activeTab === 'gantt_all') {
                csv += "MT;Klient;INS Algus;INS Lõpp;AH1 Algus;AH1 Lõpp;LUKK/TREI Algus;LUKK/TREI Lõpp;KEEV Algus;KEEV Lõpp;AH2 Algus;AH2 Lõpp;KOOSTE Algus;KOOSTE Lõpp\n";
                filteredOrders.forEach(o => { let p = getPhaseDates(o, START_VIEW); const fd = (bnd) => bnd && bnd.sDate ? safeISO(bnd.sDate) : ''; const fde = (bnd) => bnd && bnd.eDate ? safeISO(bnd.eDate) : ''; csv += `${clean(o.mt)};${clean(o.client)};${fd(p.ins)};${fde(p.ins)};${fd(p.ah1)};${fde(p.ah1)};${fd(p.lukk)};${fde(p.lukk)};${fd(p.keev)};${fde(p.keev)};${fd(p.ah2)};${fde(p.ah2)};${fd(p.kooste)};${fde(p.kooste)}\n`; });
            } else if (activeTab.startsWith('gantt_') && activeTab !== 'gantt_all') {
                let key = activeTab.split('_')[1]; if (key === 'ah1' || key === 'ah2') { csv += "Seda vaadet ei saa otse alla laadida.\n"; } else {
                    let realKey = key === 'in' ? 'ins' : key === 'tr' ? 'trei' : key === 'mk' ? 'must_k' : key === 'rk' ? 'rv_k' : key === 'ml' ? 'must_l' : key === 'rl' ? 'rv_l' : 'kooste';
                    csv += `MT;Klient;${CONFIG[realKey].l} Algus;${CONFIG[realKey].l} Lõpp;Kestvus (tööpäevi);Plaanitud (h);Tehtud (h);Eelarve Täituvus %\n`;
                    filteredOrders = filteredOrders.filter(o => f(o[realKey]) > 0);
                    filteredOrders.forEach(o => { let p = getPhaseDates(o, START_VIEW); let myBnd = CONFIG[realKey].order === 0 ? p.ins : (CONFIG[realKey].order === 1 ? p.lukk : (CONFIG[realKey].order === 2 ? p.keev : p.kooste)); let wDays = getWorkingDays(myBnd.sDate, myBnd.eDate); let pH = f(o[realKey]), aH = f(o[CONFIG[realKey].p]); let prog = pH > 0 ? Math.round((aH/pH)*100) : 0; csv += `${clean(o.mt)};${clean(o.client)};${safeISO(myBnd.sDate)};${safeISO(myBnd.eDate)};${wDays};${pH};${aH};${prog}%\n`; });
                }
            } else { csv += "Vabandust, seda vaadet ei saa otse alla laadida.\n"; }
            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); let link = document.createElement("a"); link.href = URL.createObjectURL(blob); let titleName = activeTab === 'main_view' ? 'KoguPlaan' : activeTab.toUpperCase(); link.download = `TOCI_${titleName}_${safeISO(TODAY)}.csv`; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        } catch(e) { console.error("Eksportimise viga: ", e); alert("Viga eksportimisel!"); }
    };

    window.startRealtimeSync = function() {
        updateSyncStatus("🔄 Ühendan Firebase...", "warning");
        window.dataDoc.onSnapshot((doc) => {
            if (doc.exists) {
                let data = doc.data();
                if (data.customCap) { window.customCap = data.customCap; if (!window.customCap.holidays) window.customCap.holidays = []; if (!window.customCap.wsCounts) window.customCap.wsCounts = {}; if (!window.customCap.laserBacklog) window.customCap.laserBacklog = { hours: 0, dateSet: safeISO(TODAY) }; }
                if (data.orders) {
                    window.orders = data.orders.map(o => {
                        let parsedAllocs = {}; if(o.allocs) { try { parsedAllocs = JSON.parse(o.allocs); } catch(e){} }
                        let ah1_tasks = []; let ah2_tasks = []; if (parsedAllocs.ah_tasks) { ah1_tasks = parsedAllocs.ah_tasks.ah1 || []; ah2_tasks = parsedAllocs.ah_tasks.ah2 || []; }
                        let obj = {...o, kirjeldus: o.kirjeldus||'', chk_notes: o.chk_notes||'', link: o.link||'', ah1_tasks: ah1_tasks, ah2_tasks: ah2_tasks, allocs: parsedAllocs, ins:f(o.ins), trei:f(o.trei), must_k:f(o.must_k), rv_k:f(o.rv_k), must_l:f(o.must_l), rv_l:f(o.rv_l), kooste:f(o.kooste), prog_ins:f(o.prog_ins), prog_tr:f(o.prog_tr), prog_mk:f(o.prog_mk), prog_rk:f(o.prog_rk), prog_ml:f(o.prog_ml), prog_rl:f(o.prog_rl), prog_ko:f(o.prog_ko), status: o.status || 'Töös' };
                        obj.done_ins = String(o.done_ins) === 'true'; obj.done_tr = String(o.done_tr) === 'true'; obj.done_mk = String(o.done_mk) === 'true'; obj.done_rk = String(o.done_rk) === 'true'; obj.done_ml = String(o.done_ml) === 'true'; obj.done_rl = String(o.done_rl) === 'true'; obj.done_ko = String(o.done_ko) === 'true'; obj.chk_ost = String(o.chk_ost) === 'true'; obj.chk_ah1 = String(o.chk_ah1) === 'true'; obj.chk_ah2 = String(o.chk_ah2) === 'true'; obj.start = obj.start || safeISO(TODAY); obj.progress = calcOverallProgress(obj); return obj;
                    });
                }
                let dsInput = document.getElementById('disp-start'); if(dsInput && !dsInput.value) dsInput.value = safeISO(TODAY); window.applyUIMode(); updateSyncStatus("✅ REAALAJAS", "success");
            } else { updateSyncStatus("✨ UUS ANDMEBAAS", "success"); }
        }, (error) => { console.error("Firebase viga:", error); updateSyncStatus("❌ Serveri viga", "danger"); });
    };

    window.openTab = function(e, viewId, filterType) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); e.currentTarget.classList.add('active'); document.getElementById(viewId).classList.add('active');
        if (viewId === 'main_view') { window.currentMainTabFilter = filterType; document.getElementById('view-title').innerText = filterType === 'active' ? "Aktiivsed tööd" : "Arhiiv (Lõpetatud tööd)"; let addBtn = document.getElementById('addOrderBtn'); if(addBtn) addBtn.style.display = (window.isAdmin && filterType === 'active') ? "block" : "none"; window.applyUIMode(); }
        if (viewId === 'dashboard_view') window.renderDashboard(); if (viewId === 'dispatcher_view') window.renderDispatcher(); if (viewId === 'gantt_all') window.renderMasterGantt('out-all'); if (viewId === 'gantt_ah1') window.renderAHGantt('out-ah1', 'ah1'); if (viewId === 'gantt_ah2') window.renderAHGantt('out-ah2', 'ah2');
        if (viewId.startsWith('gantt_') && viewId !== 'gantt_all' && viewId !== 'gantt_ah1' && viewId !== 'gantt_ah2') { let key = viewId.split('_')[1]; let realKey = key === 'in' ? 'ins' : key === 'tr' ? 'trei' : key === 'mk' ? 'must_k' : key === 'rk' ? 'rv_k' : key === 'ml' ? 'must_l' : key === 'rl' ? 'rv_l' : 'kooste'; window.renderGantt('out-' + key, realKey); }
        if (viewId === 'paeva_koormus_graafik') window.renderDailyCharts(); if (viewId === 'paeva_koormus_tabel') window.renderDailyTable(); if (viewId === 'voimekus_tab') { window.renderHolidays(); window.renderWSManager(); window.renderCapacity(); window.renderLaserManager(); }
    };

    window.toggleMode = function() {
        if(window.isAdmin) { window.isAdmin = false; window.activeBrushIdx = null; document.getElementById('modeToggleBtn').innerText = "🔒 VAATAJA"; document.getElementById('modeToggleBtn').style.background = "#95a5a6"; } 
        else { let pwd = prompt("Sisesta administraatori PIN kood:"); if(pwd === ADMIN_PIN) { window.isAdmin = true; document.getElementById('modeToggleBtn').innerText = "🔓 ADMIN"; document.getElementById('modeToggleBtn').style.background = "var(--danger)"; } else if (pwd !== null) { alert("Vale PIN!"); } }
        window.applyUIMode();
    };

    window.applyUIMode = function() {
        try {
            let addBtn = document.getElementById('addOrderBtn'); if(addBtn) addBtn.style.display = (window.isAdmin && window.currentMainTabFilter === 'active') ? "block" : "none";
            let capBtn = document.getElementById('saveCapBtn'); if(capBtn) capBtn.style.display = window.isAdmin ? "block" : "none";
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = window.isAdmin ? "flex" : "none");
            window.renderTable();
            const activeTab = document.querySelector('.content.active').id;
            if(activeTab === 'gantt_all') { window.renderMasterGantt('out-all'); } else if(activeTab === 'gantt_ah1') { window.renderAHGantt('out-ah1', 'ah1'); } else if(activeTab === 'gantt_ah2') { window.renderAHGantt('out-ah2', 'ah2'); } else if(activeTab.startsWith('gantt_')) { let key = activeTab.split('_')[1]; let realKey = key === 'in' ? 'ins' : key === 'tr' ? 'trei' : key === 'mk' ? 'must_k' : key === 'rk' ? 'rv_k' : key === 'ml' ? 'must_l' : key === 'rl' ? 'rv_l' : 'kooste'; window.renderGantt('out-' + key, realKey); }
            if(activeTab === 'paeva_koormus_graafik') window.renderDailyCharts(); if(activeTab === 'paeva_koormus_tabel') window.renderDailyTable(); if(activeTab === 'voimekus_tab') { window.renderHolidays(); window.renderWSManager(); window.renderCapacity(); window.renderLaserManager(); }
            if(activeTab === 'dashboard_view') window.renderDashboard(); if(activeTab === 'dispatcher_view') window.renderDispatcher();
        } catch(e) { console.error("UI Uuendamise viga:", e); }
    };

    window.openLink = function() {
        let val = document.getElementById('edit-link').value;
        if(val && val.includes('http')) window.open(val, '_blank');
        else if(val) window.open('https://' + val, '_blank');
    };

    window.renderAHTasks = function(phase) {
        let list = document.getElementById(`${phase}-tasks-list`); if(!list) return; let html = ''; let tasks = window.tempAHTasks[phase];
        if (tasks.length === 0) { html = `<div style="font-size:10px; color:#999; text-align:center; padding:10px 0;">Ülesandeid pole lisatud</div>`; } else {
            tasks.forEach((t, idx) => { html += `<div style="background:#fff; border:1px solid #ddd; border-radius:4px; padding:5px; margin-bottom:5px;"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;"><label style="display:flex; align-items:center; gap:5px; font-size:11px; margin:0; cursor:pointer; width:80%;"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="window.toggleAHTask('${phase}', ${idx}, this.checked)" style="margin:0;"> <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; ${t.done ? 'text-decoration:line-through; color:#aaa;' : 'font-weight:bold; color:#333;'}">${t.name}</span></label>${window.isAdmin ? `<button onclick="window.deleteAHTask('${phase}', ${idx})" style="color:red; background:none; border:none; cursor:pointer; font-size:16px; padding:0; line-height:1;">&times;</button>` : ''}</div><input type="text" placeholder="Kommentaar..." value="${t.comment || ''}" onchange="window.updateAHTaskComment('${phase}', ${idx}, this.value)" style="width:100%; font-size:10px; padding:3px; border:1px solid #eee; border-radius:2px; box-sizing:border-box;"></div>`; });
        } list.innerHTML = html;
    };
    window.toggleAHTask = function(phase, idx, isChecked) { window.tempAHTasks[phase][idx].done = isChecked; window.renderAHTasks(phase); }; window.updateAHTaskComment = function(phase, idx, val) { window.tempAHTasks[phase][idx].comment = val; }; window.deleteAHTask = function(phase, idx) { if(!window.isAdmin) return; window.tempAHTasks[phase].splice(idx, 1); window.renderAHTasks(phase); }; window.addAHTask = function(phase) { if(!window.isAdmin) return; let input = document.getElementById(`edit-${phase}-new-task`); let val = input.value.trim(); if(val) { window.tempAHTasks[phase].push({name: val, done: false, comment: ''}); input.value = ''; window.renderAHTasks(phase); } };

    window.calcDiff = function(k) {
        try { let c = CONFIG[k]; let pEl = document.getElementById(`edit-p-${k}`); let aEl = document.getElementById(`edit-a-${c.p}`); if(!pEl || !aEl) return; let pVal = f(pEl.value); let aVal = f(aEl.value); let diff = aVal - pVal; let el = document.getElementById(`diff-${k}`); if(!el) return; if(pVal > 0 || aVal > 0) { if(diff > 0) el.innerHTML = `<span style="color:#c62828; font-size:11px; font-weight:bold; background:#ffebee; padding:2px 4px; border-radius:3px;">+${diff}h üle</span>`; else if(diff < 0) el.innerHTML = `<span style="color:#27ae60; font-size:11px; font-weight:bold;">${Math.abs(diff)}h varu</span>`; else el.innerHTML = `<span style="color:#999; font-size:11px; font-weight:bold;">Täpselt</span>`; } else { el.innerHTML = `<span style="color:#ccc; font-size:11px;">-</span>`; } } catch(e) {}
    };

    window.openEditModal = function(i) {
        try {
            window.currentEditIndex = i; let o = window.orders[i]; let disAttr = window.isAdmin ? "" : "disabled"; let titleEl = document.getElementById('edit-modal-title'); if(titleEl) titleEl.innerText = `🗂️ Tellimuse Kaart: ${o.mt === 'UUS' ? 'Uus Tellimus' : o.mt}`;
            let mtEl = document.getElementById('edit-mt'); if(mtEl) mtEl.value = o.mt === 'UUS' ? '' : o.mt; let clientEl = document.getElementById('edit-client'); if(clientEl) clientEl.value = o.client || ''; let descEl = document.getElementById('edit-desc'); if(descEl) descEl.value = o.kirjeldus || ''; let endEl = document.getElementById('edit-end'); if(endEl) endEl.value = safeISO(o.end); let ah1El = document.getElementById('edit-ah1'); if(ah1El) ah1El.value = f(o.sub1); let ah2El = document.getElementById('edit-ah2'); if(ah2El) ah2El.value = f(o.sub2); let statusEl = document.getElementById('edit-status'); if(statusEl) statusEl.value = o.status || 'Ootel';
            let linkEl = document.getElementById('edit-link'); if(linkEl) { linkEl.value = o.link || ''; linkEl.disabled = !window.isAdmin; }
            
            let chkInsEl = document.getElementById('edit-chk-ins'); if(chkInsEl) chkInsEl.checked = o.done_ins === true; let chkOstEl = document.getElementById('edit-chk-ost'); if(chkOstEl) chkOstEl.checked = o.chk_ost === true; let chkAh1El = document.getElementById('edit-chk-ah1'); if(chkAh1El) chkAh1El.checked = o.chk_ah1 === true; let chkAh2El = document.getElementById('edit-chk-ah2'); if(chkAh2El) chkAh2El.checked = o.chk_ah2 === true; let notesEl = document.getElementById('edit-chk-notes'); if(notesEl) notesEl.value = o.chk_notes || '';
            window.tempAHTasks.ah1 = JSON.parse(JSON.stringify(o.ah1_tasks || [])); window.tempAHTasks.ah2 = JSON.parse(JSON.stringify(o.ah2_tasks || [])); window.renderAHTasks('ah1'); window.renderAHTasks('ah2');
            if(mtEl) mtEl.disabled = !window.isAdmin; if(clientEl) clientEl.disabled = !window.isAdmin; if(descEl) descEl.disabled = !window.isAdmin; if(endEl) endEl.disabled = !window.isAdmin; if(ah1El) ah1El.disabled = !window.isAdmin; if(ah2El) ah2El.disabled = !window.isAdmin; if(statusEl) statusEl.disabled = !window.isAdmin; if(chkInsEl) chkInsEl.disabled = !window.isAdmin; if(chkOstEl) chkOstEl.disabled = !window.isAdmin;
